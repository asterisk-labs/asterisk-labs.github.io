# "tools" — open-source tools, datasets and models shown on /tools.html.
# One block per item. Same shape as _data/projects.yml, but `status` here is a
# maturity label (experimental | hot code | stable | archived), not a project stage.
#
# Fields
#   title    required   name on the card (also used for alt text and the slug)
#   summary  required   one or two lines shown on the card
#   status   optional   experimental | hot code | stable | archived — shown as a card badge
#   image    optional   logo path in assets/imgs/; omit -> emoji, else under-construction mark
#   emoji    optional   a single emoji used as a temporary card logo (image wins if both set)
#   url      optional   detail page or external repo link; omit -> under-construction page
#   contact  optional   guardian shown on the placeholder: { name: ..., email: ... }
#
# Order on the page follows the order below.

- title: TACO
  status: hot code
  summary: Transparent Access to Cloud Optimized Datasets.
  url: https://asterisk.coop/taco/
  emoji: 🌮
  contact: { name: Cesar Aybar, email: cesar@asterisk.coop }

- title: BetaEarth
  status: experimental
  summary: Emulator of AlphaEarth.
  url: tools-pages/betaearth.html
  image: /assets/imgs/betaearth-logo.png
  contact: { name: Mikolaj Czerkawski, email: miko@asterisk.coop }

- title: GeoZL
  status: hot code
  summary: Spatial predictors, stream transforms and bounded-error quantizers expose raster structure to OpenZL compression graphs.
  url: https://asterisk.coop/geozl/
  image: /assets/imgs/geozl-logo.svg
  emoji: 🗜️                     # fallback only; image above wins
  contact: { email: hello@asterisk.coop }   # add guardian: { name: ..., email: ... }

- title: rumi
  status: hot code
  summary: Stateless raster storage for AI4EO.
  url: https://asterisk.coop/rumi/
  image: /assets/imgs/rumi-logo.svg
  emoji: 🗄️                     # fallback only; image above wins
  contact: { email: hello@asterisk.coop }   # add guardian: { name: ..., email: ... }

- title: Major TOM
  status: stable
  summary: A standard for curating, sharing and combining large-scale EO datasets.
  url: tools-pages/major-tom.html
  image: /assets/imgs/major-tom-logo.png
  # Community EO-dataset standard, started at ESA Phi-lab; Asterisk co-develops it
  # (co-founders Alistair Francis & Mikolaj Czerkawski). Link-out for now; a full
  # detail page can credit ESA + the community framing later.
  contact: { name: Mikolaj Czerkawski, email: miko@asterisk.coop }

- title: cozip
  status: stable
  summary: Open a ZIP like table!
  url: https://asterisk.coop/cozip/
  image: /assets/imgs/cozip-logo.svg
  contact: { email: hello@asterisk.coop }   # add guardian: { name: ..., email: ... }
