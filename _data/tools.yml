# "tools" — open-source tools, datasets and models shown on /tools.html.
# One block per item. Same shape as _data/projects.yml, minus `status`
# (these are not staged ongoing/upcoming/complete).
#
# Fields
#   title    required   name on the card (also used for alt text and the slug)
#   summary  required   one or two lines shown on the card
#   image    optional   logo path in assets/imgs/; omit -> emoji, else under-construction mark
#   emoji    optional   a single emoji used as a temporary card logo (image wins if both set)
#   url      optional   detail page or external repo link; omit -> under-construction page
#   contact  optional   guardian shown on the placeholder: { name: ..., email: ... }
#
# Order on the page follows the order below.

- title: TACO
  summary: Transparent Access to Cloud Optimized Datasets.
  url: https://asterisk.coop/taco/
  emoji: 🌮
  contact: { name: Cesar Aybar, email: cesar@asterisk.coop }

