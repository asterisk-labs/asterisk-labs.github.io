---
layout: default
title: Under Construction
---

<main class="mb-auto" style="text-align:center; max-width:600px; margin:auto;">
    <img src="/assets/imgs/mark-construction.svg" alt="" aria-hidden="true" style="width:92px;height:auto;margin-bottom:26px;">
    <h3 id="uc-title" style="margin-bottom:20px;">under construction</h3>
    <p id="uc-msg" style="font-size:1.05rem; line-height:1.6; color:#555;">This project page is still being built. For more information or urgent questions, email <a href="mailto:hello@asterisk.coop" style="color:#492ae8ff;">hello@asterisk.coop</a>.</p>
    <p style="margin-top:30px;"><a id="uc-back" href="/projects.html" style="color:#492ae8ff;">&larr; back to projects</a></p>
</main>

<script type="text/javascript">
    // Projects and magic items (from _data/projects.yml and _data/magic.yml) so
    // this shared page can name the right item and its guardian, from ?p=<slug>.
    window.AL_ITEMS = [
    {% for p in site.data.projects %}{ slug: {{ p.title | slugify | jsonify }}, title: {{ p.title | jsonify }}, area: "projects"{% if p.contact %}, contact: { name: {{ p.contact.name | jsonify }}, email: {{ p.contact.email | default: "hello@asterisk.coop" | jsonify }} }{% endif %} },
    {% endfor %}{% for m in site.data.magic %}{ slug: {{ m.title | slugify | jsonify }}, title: {{ m.title | jsonify }}, area: "magic"{% if m.contact %}, contact: { name: {{ m.contact.name | jsonify }}, email: {{ m.contact.email | default: "hello@asterisk.coop" | jsonify }} }{% endif %} },
    {% endfor %}];

    (function () {
        var slug = new URLSearchParams(location.search).get('p');
        if (!slug) return;
        var item = (window.AL_ITEMS || []).filter(function (x) { return x.slug === slug; })[0];
        if (!item) return;

        document.getElementById('uc-title').textContent = item.title + ' — under construction';
        var email = (item.contact && item.contact.email) || 'hello@asterisk.coop';
        var lead = (item.contact && item.contact.name)
            ? 'This page is being built by ' + item.contact.name + '. '
            : 'This page is still being built. ';
        document.getElementById('uc-msg').innerHTML = lead +
            'For more information or urgent questions, email ' +
            '<a href="mailto:' + email + '" style="color:#492ae8ff;">' + email + '</a>.';

        if (item.area === 'magic') {
            var back = document.getElementById('uc-back');
            back.setAttribute('href', '/magic.html');
            back.textContent = '← back to magic';
        }
    })();
</script>
